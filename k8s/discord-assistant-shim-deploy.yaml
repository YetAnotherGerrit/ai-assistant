apiVersion: apps/v1
kind: Deployment
metadata:
  name: discord-assistant-shim
  namespace: '{{"NAMESPACE" | env}}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: discord-assistant-shim
  template:
    metadata:
      labels:
        app: discord-assistant-shim
        sc.assistant: 'true'
    spec:
      serviceAccountName: sc-assistant
      # No imagePullSecrets on purpose: the nuke registry
      # (docker.prod.nuke.benjamin-borbe.de:443) serves anonymous pulls, and
      # no `docker` secret exists in any namespace — the fleet's other
      # deployments reference one that is absent. Verified 2026-08-31: pulls
      # succeed in star-citizen with none configured.
      # node user (uid 1000) must write the local-path vault PVC; image USER is
      # non-numeric (node) so runAsNonRoot needs an explicit numeric runAsUser.
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
      terminationGracePeriodSeconds: 30
      initContainers:
        # Clone the vault repo into /vault on first start (empty PVC).
        - name: vault-clone
          image: '{{"DOCKER_REGISTRY" | env}}/bborbe/discord-assistant:{{"BRANCH" | env}}'
          command: ['sh', '-c']
          args:
            - |
              set -eu
              export GIT_SSH_COMMAND="ssh -i /home/node/.ssh/vault_deploy_key -o StrictHostKeyChecking=accept-new"
              if [ ! -d /vault/.git ]; then
                git clone git@github.com:bborbe/obsidian-starcitzen.git /vault
              fi
          volumeMounts:
            - { name: vault, mountPath: /vault }
            - { name: ssh-deploy-key, mountPath: /home/node/.ssh, readOnly: true }
            - { name: tmp, mountPath: /tmp }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ['ALL'] }
      containers:
        # obsidian-git equivalent: pull Mac changes, commit + push pod writes.
        #
        # A regular container, not a native sidecar (initContainer with
        # restartPolicy: Always) — so the pod's own `restartPolicy: Always`
        # governs it and the kubelet restarts it in place if it crashes. No
        # per-container restartPolicy is needed or valid here.
        - name: vault-sync
          image: '{{"DOCKER_REGISTRY" | env}}/bborbe/discord-assistant:{{"BRANCH" | env}}'
          command: ['sh', '/vault-scripts/vault-sync.sh']
          volumeMounts:
            - { name: vault, mountPath: /vault }
            - { name: ssh-deploy-key, mountPath: /home/node/.ssh, readOnly: true }
            - { name: vault-scripts, mountPath: /vault-scripts, readOnly: true }
            - { name: tmp, mountPath: /tmp }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ['ALL'] }
        - name: shim
          # Same image as the bot — this container overrides the ENTRYPOINT.
          image: '{{"DOCKER_REGISTRY" | env}}/bborbe/discord-assistant:{{"BRANCH" | env}}'
          imagePullPolicy: Always
          command: ['python3', '-u', 'shim/claude_openai_shim.py']
          ports:
            - name: http
              containerPort: 8080
          env:
            # Listen on the pod IP, not loopback — the bot reaches this via the
            # claude-shim Service from a different pod.
            - name: SHIM_HOST
              value: 0.0.0.0
            - name: SHIM_PORT
              value: '8080'
            # Which model this endpoint advertises to OpenAI clients.
            - name: SHIM_MODEL
              value: claude-code
            # The shim shells out to the `claude` CLI, which reaches the backend
            # through the in-cluster router (ROUTER_HOST resolves per env, e.g.
            # http://claude-code-router-dev.dev.svc.cluster.local:8788). No
            # provider credential in the pod: ANTHROPIC_API_KEY is a router
            # x-api-key, not any provider/company key.
            - name: ANTHROPIC_BASE_URL
              value: '{{"ROUTER_HOST" | env}}'
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef: { name: discord-assistant, key: ROUTER_API_KEY }
            # The filesystem the assistant reaches: the SC vault only.
            - name: SHIM_CWD
              value: /vault
            - name: SHIM_SESSIONS_FILE
              value: /home/node/shim-sessions.json
            # Default-persona MCP config. Without it a key carrying no identity
            # segment falls back to the module default
            # (~/.claude/mcp-obsidian-personal.json), absent in the pod — claude
            # then exits and the turn fails with EIO.
            - name: SHIM_MCP_CONFIG
              value: /home/node/mcp-empty.json
            # Identity config: identities.sc -> cwd /vault, tight allowed-tools,
            # empty MCP set (see sc-assistant-config.yaml).
            - name: DISCORD_ASSISTANT_CONFIG
              value: /home/node/.config/discord-assistant/config.yaml
            - name: LOG_LEVEL
              value: info
          volumeMounts:
            # Writable home for the shim: claude CLI session state + shim-sessions.json.
            - name: shim-home
              mountPath: /home/node
            # The SC vault (git clone of bborbe/obsidian-starcitzen).
            - name: vault
              mountPath: /vault
            # Identity config + empty MCP file (subPath files into shim-home).
            - name: sc-assistant-config
              mountPath: /home/node/.config/discord-assistant/config.yaml
              subPath: config.yaml
              readOnly: true
            # NOTE: mounted at the emptyDir root, NOT inside /home/node/.claude —
            # a subPath mount there auto-creates the dir as root-owned and the
            # shim (uid 1000) cannot write shim-sessions.json into it.
            - name: sc-assistant-config
              mountPath: /home/node/mcp-empty.json
              subPath: mcp-empty.json
              readOnly: true
            # vault-cli's config (vault name -> /vault), at the XDG path the
            # binary reads by default. Read-only on purpose: vault-cli writes to
            # the vault, never to its own config, and a pod that could rewrite
            # its vault mapping would be able to leave /vault silently.
            # Same subPath caveat as mcp-empty.json above — the parent dir is
            # created root-owned, which is fine for a file only ever read.
            - name: sc-assistant-config
              mountPath: /home/node/.config/vault-cli/config.yaml
              subPath: vault-cli.yaml
              readOnly: true
            # claude CLI scratch (EROFS without a writable /tmp).
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet: { path: /v1/models, port: http }
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /v1/models, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 2
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ['ALL'] }
      volumes:
        - name: tmp
          emptyDir: {}
        - name: shim-home
          emptyDir: {}
        - name: vault
          persistentVolumeClaim:
            claimName: sc-vault
        - name: sc-assistant-config
          configMap:
            name: sc-assistant-config
        - name: vault-scripts
          configMap:
            name: sc-assistant-config
            items:
              - key: vault-sync.sh
                path: vault-sync.sh
        - name: ssh-deploy-key
          secret:
            secretName: discord-assistant
            items:
              - key: VAULT_GIT_KEY
                path: vault_deploy_key
            # 0444: secret files are root-owned, but the vault-clone / vault-sync
            # containers run as the non-root node user (uid 1000). Pod-local key;
            # the pod is already isolated by the NetworkPolicy.
            defaultMode: 0444
