# Identity config for the Star Citizen assistant pod.
#
# The shim (shim/claude_openai_shim.py) reads this via DISCORD_ASSISTANT_CONFIG
# (default ~/.config/discord-assistant/config.yaml). The sc identity is the
# pod's persona: cwd = the vault, bare `claude` (no launcher script — the pod
# has no laptop launcher), a tight tool allowlist, and an EMPTY MCP config so
# `--strict-mcp-config` passes with zero servers.
#
# The empty MCP config is deliberate, not an unfinished placeholder. The laptop
# twin reaches semantic search at http://127.0.0.1:8321/mcp?scope=starcitzen and
# nothing in-cluster answers that: no semantic-search Deployment or Service runs
# on nuke-dev or nuke-prod, `bborbe/semantic-search` publishes no image, and it
# is a PyTorch/sentence-transformers service whose model cache and index do not
# fit this pod's 1Gi limit under a read-only rootfs (verified 2026-09-20).
# Standing it up is its own task — [[Stand up Semantic Search In-Cluster for the
# SC Shim]]. Do not "fix" this by pointing mcp_config at a URL: an empty config
# fails loudly and immediately, while a config pointing at something that never
# answers fails as a turn timeout that reads like a model problem.
#
# NOTE: no claude_script on purpose. A launcher owns --add-dir/model/effort and
# would reference laptop paths; the pod runs bare `claude` bounded by
# --allowed-tools + --permission-mode auto (the shim passes both).
apiVersion: v1
kind: ConfigMap
metadata:
  name: sc-assistant-config
  namespace: star-citizen
data:
  config.yaml: |
    identities:
      sc:
        cwd: /vault
        mcp_config: /home/node/mcp-empty.json
        # Per-identity `allowed_tools` REPLACES the shim default, it does not
        # extend it — so this list must stay complete on its own.
        #
        # `Bash(vault-cli:*)` was withheld until 2026-09-20 because the binary
        # was not in the image; granting it then would only have widened the
        # allowlist for something that could not run. The install landed with
        # the grant (see the Dockerfile), so the two are no longer separable.
        #
        # The semantic-search MCP tools are deliberately absent: there is no
        # in-cluster server to answer them (see the note at the top of this
        # file). They arrive with [[Stand up Semantic Search In-Cluster for the
        # SC Shim]], not before.
        allowed_tools: Read,Edit,Write,Glob,Grep,Bash(date:*),Bash(shasum:*),Bash(ls:*),Bash(gh api:*),Bash(gh pr view:*),Bash(git ls-remote:*),Bash(vault-cli:*)
  mcp-empty.json: |
    {"mcpServers": {}}
  # vault-cli's own config. Without it the binary has no vault to resolve:
  # `vault-cli task list` needs a name->path mapping, and the laptop's
  # ~/.config/vault-cli/config.yaml points at /Users/bborbe/... paths that do
  # not exist here. Only the fields the pod can honour are carried over —
  # claude_script and session_project_dir are laptop paths and are dropped, and
  # notification.brokers is omitted so the pod never dials the laptop's Kafka.
  #
  # Dir names come from the StarCitizen vault, which uses its own layout
  # (23 Goals / 24 Tasks), not Personal's (24 Goals / 25 Tasks).
  vault-cli.yaml: |
    current_user: sc-assistant
    default_vault: starcitzen
    vaults:
      starcitzen:
        name: starcitzen
        path: /vault
        tasks_dir: 24 Tasks
        goals_dir: 23 Goals
        daily_dir: 60 Periodic Notes/Daily
        knowledge_dir: 50 Knowledge Base
        excludes: ['90 Templates', '.claude', '.obsidian']
  vault-sync.sh: |
    #!/bin/sh
    # obsidian-git equivalent for the pod: keep /vault current (pull) and push
    # back anything the assistant wrote (commit on change). Pull first so a Mac
    # edit that obsidian-git already pushed is not clobbered by a pod push.
    set -eu
    export GIT_SSH_COMMAND="ssh -i /home/node/.ssh/vault_deploy_key -o StrictHostKeyChecking=accept-new"
    # The PVC files are owned by the vault-clone init user; git's
    # dubious-ownership check refuses the repo otherwise. Env-based config —
    # /home/node is on the read-only rootfs, so `git config --global` cannot
    # write there.
    export GIT_CONFIG_COUNT=1
    export GIT_CONFIG_KEY_0=safe.directory
    export GIT_CONFIG_VALUE_0=/vault
    cd /vault
    # Errors are logged, never silenced: a sync that cannot push must be visible
    # in `kubectl logs`, not an infinite quiet loop. The loop still continues —
    # a transient network failure should not end the sidecar — but every failure
    # prints. The container's restartPolicy is the pod's (Always), so a genuine
    # crash is restarted in place by the kubelet.
    #
    # Order is COMMIT -> PULL -> PUSH, not pull-first: `git pull --rebase` aborts
    # with "cannot pull with rebase: You have unstaged changes" whenever the
    # assistant has written since the last cycle, which is exactly when a sync is
    # needed. Committing local work first makes the rebase a normal
    # commit-on-commit merge. (Observed live on nuke-dev 2026-08-31 — the error
    # was invisible until this loop started logging.)
    while true; do
      if [ -n "$(git status --porcelain)" ]; then
        git add -A
        git -c user.email="${VAULT_GIT_EMAIL:-sc-assistant@starcitzen}" \
            -c user.name="${VAULT_GIT_NAME:-SC Assistant}" \
            commit -m "vault sync: $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          || echo "vault-sync: commit failed"
      fi
      git pull --rebase --quiet || echo "vault-sync: pull failed (continuing)"
      # Push whenever the local branch is ahead — covers a commit made this cycle
      # and one left unpushed by an earlier failure.
      if [ -n "$(git log --branches --not --remotes --oneline 2>/dev/null)" ]; then
        git push --quiet || echo "vault-sync: push failed (will retry next cycle)"
      fi
      sleep 30
    done
