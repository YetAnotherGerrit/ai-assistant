# The discord-assistant Secret — resolved at `make apply` time from TeamVault.
# The deploy env files hold only lookup keys (`ROUTER_API_KEY=dqD4nq`,
# `DISCORD_TOKEN_KEY=BOr18w`, `VAULT_GIT_KEY=YLbQgO`,
# `CHAT_BRIDGE_TOKEN_KEY=8q10WL`); the templates fetch the values and
# base64-encode them for the Secret's data. The claude-code-router
# has no allowedApiKeys, so ROUTER_API_KEY is not validated — it exists so the
# Secret is reproducible in-repo instead of hand-applied.
#
# IMPORTANT: this manifest must list ALL keys of the live Secret. kubectl apply
# on an apply-owned Secret deletes data keys absent from the new config — the
# v0.29.2 ROUTER_API_KEY-only version silently wiped DISCORD_TOKEN, VAULT_GIT_KEY,
# ADMIN_USER_IDS and ALLOWED_USER_IDS from both clusters (observed 2026-09-03,
# shims stuck in Init:0/1 until restored). Keep every key here.
#
# ADMIN_USER_IDS / ALLOWED_USER_IDS are non-secret Discord user IDs (identical
# in both live namespaces), kept as literals.
#
# VAULT_GIT_KEY differs: TeamVault's --password-stdin trims trailing newlines,
# so the entry holds the key's exact base64 (the --file create 500s on it) and
# the template passes it through WITHOUT `| base64` — the rendered value must
# equal the live secret's data byte-for-byte.
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: discord-assistant
  namespace: '{{ "NAMESPACE" | env }}'
data:
  ADMIN_USER_IDS: MTk3ODMwMjUwNDE4Mjc0MzA0
  ALLOWED_USER_IDS: MTk3ODMwMjUwNDE4Mjc0MzA0LDE0MTY2NTM1NDQ3NTc2NTc2MA==
  # The shim control-plane token, added 2026-09-20. It must be in this manifest
  # BEFORE the guarded shim ships: the check is fail-closed, so a token missing
  # on either side breaks session management (`new`, `switch`, voice binding,
  # every `/chat/completions` turn) on the first restart rather than degrading.
  # Lookup key `CHAT_BRIDGE_TOKEN_KEY` already exists in the deploy env files —
  # this line is what finally puts it in the cluster.
  CHAT_BRIDGE_TOKEN: '{{ "CHAT_BRIDGE_TOKEN_KEY" | env | teamvaultPassword | base64 }}'
  DISCORD_TOKEN: '{{ "DISCORD_TOKEN_KEY" | env | teamvaultPassword | base64 }}'
  ROUTER_API_KEY: '{{ "ROUTER_API_KEY" | env | teamvaultPassword | base64 }}'
  VAULT_GIT_KEY: '{{ "VAULT_GIT_KEY" | env | teamvaultPassword }}'
