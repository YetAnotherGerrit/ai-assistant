# discord-assistant — endpoint configuration
#
# Copy to ~/.config/discord-assistant/config.yaml, or point
# DISCORD_ASSISTANT_CONFIG somewhere else. Every value is optional; with no file
# at all the shim runs exactly as it did before this existed.
#
# Precedence: environment > this file > default. Environment wins last so a k8s
# ConfigMap, a `SHIM_*` var or a one-off `SHIM_SPOKEN_MAX=0 make shim` still
# overrides the file without editing it.
#
# ONE INSTANCE, ONE CONFIG — deliberately no profiles. Two configurations means
# two deployments, which is what k8s is for, and only one profile could ever be
# active in a single process anyway.
#
# NO SECRETS HERE. Unlike local.env this file is not gitignored. Reference
# TeamVault key *ids*; the launcher resolves them into the environment.

# ── which Claude ───────────────────────────────────────────────────────────
# The launcher that starts Claude. Naming a script beats restating its flags:
# the wrapper already pins the router, model, effort and --add-dir set that
# every other entry point uses, and a second copy of that list drifts from it
# silently. Left unset, a bare `claude` is spawned — which cannot see anything
# outside `cwd`.
#
# ⚠️ A launcher's --add-dir set becomes readable by everyone on the Discord
# allowlist. cc-personal adds ~/Documents/workspaces — every repo on the
# machine. Widen this deliberately, not by default.
# claude_script: ~/Documents/workspaces/scripts/cc-personal

cwd: ~/Documents/Obsidian/Personal
# mcp_config is ignored when claude_script is set — the launcher passes its own.
mcp_config: ~/.claude/mcp-obsidian-personal.json
sessions_file: ~/.claude/shim-sessions.json
# claude_model: ""          # empty = whatever the launcher or CLI defaults to
# unsafe: false             # true removes the tool allowlist entirely
# allowed_tools: Read,Edit,Write,Glob,Grep,Bash(vault-cli:*),...

# Told to the assistant so it knows the call is being written down, and where.
transcript_dir: ~/Documents/Obsidian/Personal/60 Periodic Notes/Transcripts

# Where a peer session's reply to a relay question is dropped, so the answer
# reaches the speaker as a FILE instead of as a message.
#
# WHY: a shim session registers as `entrypoint: sdk-cli`, and every peer send to
# it fails with a bare "Failed to send" while its socket, process and registry
# entry all look healthy — so the failure reads as a wedged peer. Observed live
# 2026-09-20: the assistant promised to relay a question, the peer answered four
# times, and the human heard nothing for two hours.
#
# Both sides already share a filesystem, so the reply is written to
# `<relay_dir>/inbox/<id>.answer.json` and the shim claims it at the next turn,
# putting it at the front of the prompt so the model answers with it. A claimed
# file is renamed to `*.answer.json.done`; an unparseable one is left in place,
# because silently dropping a peer's message is the failure this path prevents.
# Empty disables the relay entirely.
relay_dir: ~/Documents/Assistant/Personal/relay

# Does speaking while the assistant is answering CANCEL that answer?
#
# `false` (the built-in default) keeps today's behaviour: the listener speaking
# mid-turn ends the in-flight answer, and the reply dies at `0 chars`. `true`
# lets the turn run to completion, so the full answer still reaches the chat
# bridge and the transcript.
#
# WHY OFF IS THE SAFER SETTING IN A ROOM WITH BACKGROUND SPEECH. The cancel
# fires on the VAD's `speech_started` — before any words exist — so "okay" and
# "stop" are the same event and there is nothing to filter on. A child, a TV or
# a second conversation cancels an answer exactly as effectively as the operator
# does, and the failure is silent: the person who asked hears nothing. A
# finished answer that arrived late beats no answer at all.
#
# TWO LEVELS. `/interrupt off` in the call's text chat writes a PER-KEY override
# that lives in memory and is gone the moment the shim restarts — so a room that
# wants cancellation off has to re-issue the slash command after every restart,
# and a restart is not something the person in the call can see. This value is
# the durable level: what an un-overridden conversation falls back to. `/interrupt
# default` clears an override and returns here.
barge_in_off: false

# ── per-identity persona (voice) ───────────────────────────────────────────
# Lets multiple Discord identities share this ONE shim — and the one
# `speech-to-speech` process every voice call goes through — without
# answering with each other's persona, session store or vault.
#
# WHY THIS EXISTS: speech-to-speech wires its backend at process startup and
# never changes it, so every spoken turn from EVERY identity's bot reaches
# this same shim regardless of which guild is talking. Without an entry
# below, a second identity's spoken turns are answered using the top-level
# `cwd`/`claude_script`/`mcp_config`/`allowed_tools` above — i.e. this
# instance's own default persona, not the guild's.
#
# Keyed by IDENTITY NAME — set `IDENTITY=sc` (etc.) in that bot's
# `local.env` and the voice key it binds becomes `voice:<guildId>:sc`, so
# persona is a function of WHICH BOT is talking, not which guild. This is the
# axis that matters: one identity serving several guilds wants ONE persona
# across all of them, and two identities sharing a guild must NOT collide on
# the same key. Any field left unset for an identity falls back to the
# top-level default above.
# `chat_bridge_url` overrides where THIS identity's spoken-turn full answer
# gets posted — the endpoint a spoken reply's full text is bridged to as
# chat, normally set globally via `chat_bridge.url` / `SHIM_CHAT_BRIDGE_URL`
# (default http://127.0.0.1:8081/chat). WHY IT HAS TO BE PER IDENTITY: the
# shim is shared by N bots and each bot runs its OWN health server on its OWN
# port (personal :8081, sc :8091, boss :8101). The global default names ONE
# of those ports, so without an override here every identity's bridged
# answer posts to the SAME bot — whichever one owns that default. The other
# identities still SPEAK correctly (persona/cwd routing is unaffected), but
# their bridged text lands on the wrong bot, which then drops it because it
# has no live voice session — from Discord this looked like "the assistant
# said the details are in the chat" into an empty channel. Left unset, an
# identity falls back to the global default exactly as before — a
# single-identity install needs no migration.
# identities:
#   sc:                          # matches sc-assistant's IDENTITY=sc
#     cwd: ~/Documents/Obsidian/StarCitizen
#     claude_script: ~/Documents/workspaces/scripts/cc-sc
#     chat_bridge_url: http://127.0.0.1:8091/chat
#   boss:                        # matches boss-assistant's IDENTITY=boss
#     cwd: ~/Documents/Obsidian/Boss
#     claude_script: ~/Documents/workspaces/scripts/cc-boss
#     chat_bridge_url: http://127.0.0.1:8101/chat
#   bro:                         # matches brogrammers-assistant's IDENTITY=bro
#     cwd: ~/Documents/Obsidian/BrogrammersAssistant
#     claude_script: ~/Documents/workspaces/scripts/cc-discord-assistant-bro
#     chat_bridge_url: http://127.0.0.1:8131/chat
#
# Still accepted, for a bot that has no IDENTITY set: an entry keyed by
# Discord GUILD id instead, exactly as `v0.16.0` shipped it — the shim falls
# back to a guild-id lookup in this SAME map whenever the voice key it
# receives has no identity segment (`voice:<guildId>`, not
# `voice:<guildId>:<identity>`).
#   "123456789012345678":       # a guild, for a bot with no IDENTITY set
#     cwd: ~/Documents/Obsidian/StarCitizen
#
# strict: true                 # opt-in, default false — see below

# ── identities.strict (opt-in, default OFF) ────────────────────────────────
# WHY THIS EXISTS: the fallback above is the ONE thing in this shim that
# fails OPEN. Every other guard fails closed — an empty CHAT_BRIDGE_TOKEN
# refuses all posts, a malformed identities entry above warns and skips, a
# 404 from /voice/bind degrades to one shared conversation — but a turn whose
# key names no identity, or an identity absent from the map above, is served
# by the top-level cwd/claude_script at the head of this file, which is the
# MOST PRIVILEGED persona on the machine: the Personal vault, and
# cc-personal's --add-dir over every repo under ~/Documents/workspaces. A
# new bot whose IDENTITY is unset, misspelled, or missing an entry above
# does not error — it silently inherits that access.
#
# With `identities:` non-empty and `strict: true`, such a turn is REFUSED
# (HTTP 403, no process spawned) instead of served by the default. Default
# is OFF and only takes effect when `identities:` is also configured — a
# fresh single-identity install has no `identities:` block at all and keeps
# resolving to the default silently, which is correct for that shape, not a
# misconfiguration. Even with strict off, a turn that falls back to the
# default while `identities:` is configured logs a WARNING (once per key)
# naming which case it was, so the drift is visible in the log either way.
#
# strict: true
# SHIM_IDENTITIES_STRICT=1 works the same, env-first like every other setting.

# ── serving ────────────────────────────────────────────────────────────────
host: 127.0.0.1
port: 8080
model: claude-code # the name echoed back in OpenAI responses
timeout: 300

# ── fast front tier ────────────────────────────────────────────────────────
# Answers conversation directly; defers anything else to Claude Code, which
# costs ~3.4s per turn before its model starts.
front:
  base_url: https://api.minimax.io/v1
  model: MiniMax-M3 # only M3 can disable reasoning; M2.x leak <think>
  # api_key_id: XXXXXX      # TeamVault key id — the launcher exports the value
  timeout: 4.0
  history: 8
  heuristics: true

# ── voice pacing ───────────────────────────────────────────────────────────
voice:
  # Comma-separated, prefix-matched, case-insensitive. Without this the
  # assistant answers every sentence an allowlisted speaker says in a call,
  # including ones addressed to other people in the room. The extra entries are
  # speech-to-text mishearings of the first — add what your transcripts show.
  # Empty string disables the gate. Typed turns are never gated.
  wake_phrases: hey bot,hey bought,hey but,hi bot
  spoken_max: 2 # sentences spoken before "there's more if you want it"; 0 = uncapped
  hold_after: 0.5 # silence before a holding line
  hold_max: 8.0
  progress_every: 12.0
  keepalive_every: 8.0 # must stay under speech-to-speech's 20s read timeout
